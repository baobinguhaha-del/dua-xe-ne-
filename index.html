<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đua Xe Né Vật Cản</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
        }
        canvas {
            border: 4px solid #00e5ff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
            background: #222;
        }
    </style>
</head>
<body>
    <h2>🏎️ ĐUA XE NÉ CHƯỚNG NGOẠI VẬT 🪨</h2>
    <p>Dùng phím mũi tên <b>Trái / Phải</b> để né xe và đá!</p>
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Xe người chơi
        let car = { x: 175, y: 480, w: 50, h: 90, speed: 7 };
        let obstacles = [];
        let score = 0;
        let isGameOver = false;
        let keys = {};
        let roadY = 0;

        const carColors = ["#ff3366", "#ff9900", "#33cc33", "#9933ff", "#ffff00"];

        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if (isGameOver && e.code === "Space") restartGame();
        });
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        function spawnObstacle() {
            if (isGameOver) return;
            let lanes = [45, 175, 305];
            let x = lanes[Math.floor(Math.random() * lanes.length)];
            let isRock = Math.random() < 0.35; // 35% ra đá, 65% ra xe

            obstacles.push({
                x: x,
                y: -100,
                w: isRock ? 50 : 50,
                h: isRock ? 50 : 90,
                speed: 5,
                type: isRock ? "rock" : "car",
                color: carColors[Math.floor(Math.random() * carColors.length)]
            });
        }

        setInterval(spawnObstacle, 1500);

        function update() {
            if (isGameOver) return;

            roadY = (roadY + 5) % 40;

            if (keys["ArrowLeft"] && car.x > 20) car.x -= car.speed;
            if (keys["ArrowRight"] && car.x < canvas.width - 70) car.x += car.speed;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += obs.speed;

                // Va chạm
                if (
                    car.x < obs.x + obs.w - 5 &&
                    car.x + car.w - 5 > obs.x &&
                    car.y < obs.y + obs.h - 5 &&
                    car.y + car.h - 5 > obs.y
                ) {
                    isGameOver = true;
                }

                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                }
            }
        }

        function drawCar(x, y, w, h, color) {
            // Thân xe
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 10);
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Kính chắn gió
            ctx.fillStyle = "#111";
            ctx.fillRect(x + 8, y + 15, w - 16, 18);

            // Bánh xe
            ctx.fillStyle = "#000";
            ctx.fillRect(x - 4, y + 10, 5, 18);
            ctx.fillRect(x + w, y + 10, 5, 18);
            ctx.fillRect(x - 4, y + h - 28, 5, 18);
            ctx.fillRect(x + w, y + h - 28, 5, 18);

            // Đèn xe
            ctx.fillStyle = "#fff700";
            ctx.fillRect(x + 5, y + 2, 8, 4);
            ctx.fillRect(x + w - 13, y + 2, 8, 4);
        }

        function drawRock(x, y, w, h) {
            ctx.fillStyle = "#888";
            ctx.beginPath();
            ctx.moveTo(x + 10, y);
            ctx.lineTo(x + w, y + 15);
            ctx.lineTo(x + w - 5, y + h);
            ctx.lineTo(x + 5, y + h - 5);
            ctx.lineTo(x, y + 20);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function draw() {
            // Mặt đường
            ctx.fillStyle = "#333";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vạch đường đứt đoạn
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 4;
            ctx.setLineDash([25, 15]);
            ctx.lineDashOffset = -roadY;
            ctx.beginPath();
            ctx.moveTo(133, 0); ctx.lineTo(133, canvas.height);
            ctx.moveTo(266, 0); ctx.lineTo(266, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Vẽ xe chơi
            drawCar(car.x, car.y, car.w, car.h, "#00e5ff");

            // Vẽ vật cản
            obstacles.forEach(obs => {
                if (obs.type === "car") {
                    drawCar(obs.x, obs.y, obs.w, obs.h, obs.color);
                } else {
                    drawRock(obs.x, obs.y, obs.w, obs.h);
                }
            });

            // Điểm số
            ctx.fillStyle = "#fff";
            ctx.font = "bold 20px Arial";
            ctx.fillText("Điểm: " + score, 15, 30);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ff3366";
                ctx.font = "bold 32px Arial";
                ctx.textAlign = "center";
                ctx.fillText("THUA CỦA BẠN!", canvas.width / 2, 260);

                ctx.fillStyle = "#fff";
                ctx.font = "20px Arial";
                ctx.fillText("Tổng điểm: " + score, canvas.width / 2, 300);
                
                ctx.fillStyle = "#00e5ff";
                ctx.font = "16px Arial";
                ctx.fillText("Nhấn SPACE (Dấu cách) để chơi lại", canvas.width / 2, 350);
                ctx.textAlign = "left";
            }
        }

        function restartGame() {
            car.x = 175;
            obstacles = [];
            score = 0;
            isGameOver = false;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
