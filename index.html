<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đua Xe Siêu Tốc - Tiki Tiki Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #090d16;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }
        h2 { margin: 0 0 3px 0; font-size: 20px; text-shadow: 0 0 10px rgba(0,229,255,0.6); }
        p { margin: 0 0 8px 0; color: #94a3b8; font-size: 12px; }
        canvas {
            display: block;
            border: 4px solid #00e5ff;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
            background: #1e293b;
        }
        #musicToggleBtn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #00e5ff;
            color: #090d16;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
            transition: 0.2s;
        }
        #musicToggleBtn:hover {
            background: #38bdf8;
        }
    </style>
</head>
<body>
    <h2>🏎️ ĐUA XE SIÊU TỐC - TIKI TIKI EDITION ⚡</h2>
    <p>Né sát sạt xe khác để nạp Adrenaline. Nhạc tự động lặp lại liên tục!</p>
    <canvas id="gameCanvas" width="600" height="650"></canvas>
    <button id="musicToggleBtn" onclick="toggleMusic()">🔊 Bật/Tắt Nhạc Tiki Tiki</button>

    <!-- Thêm thuộc tính loop để âm thanh tự động lặp lại khi kết thúc -->
    <audio id="bgMusic" loop>
        <source src="tikitiki.mp3" type="audio/mp3">
    </audio>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const bgMusic = document.getElementById("bgMusic");

        // Đảm bảo dự phòng tự lặp lại bằng JS nếu trình duyệt chặn thuộc tính loop của thẻ audio
        bgMusic.addEventListener('ended', function() {
            this.currentTime = 0;
            this.play();
        }, false);

        let gameStarted = false;
        let isMusicPlaying = false;

        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.volume = 0.7;
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    document.getElementById("musicToggleBtn").innerText = "🔊 Tắt Nhạc Tiki Tiki";
                }).catch(e => {
                    console.log("Trình duyệt chặn tự động phát nhạc:", e);
                });
            } else {
                bgMusic.pause();
                isMusicPlaying = false;
                document.getElementById("musicToggleBtn").innerText = "🔇 Bật Nhạc Tiki Tiki";
            }
        }

        let car = { x: 275, y: 520, w: 50, h: 90, speed: 6.5, scaleX: 1, scaleY: 1, angle: 0 };
        let obstacles = [];
        let shields = [];
        let roadBlockages = [];
        let trees = [];
        let particles = [];
        let floatingTexts = [];

        let score = 0;
        let combo = 0;
        let adrenaline = 0;
        let isSlowMo = false;
        let slowMoTimer = 0;
        let hasShield = false;
        let isGameOver = false;
        let explosionTimer = 0;
        let screenShakeTimer = 0;
        let keys = {};
        let roadY = 0;

        let roadEventTimer = 0;
        let currentRoadEvent = "normal";
        let roadEventDuration = 0;

        const carColors = ["#ff3366", "#ff9900", "#33cc33", "#9933ff", "#ffff00", "#00bcd4", "#ff4757", "#2ed573"];
        const carTypes = ["supercar", "suv", "sedan", "van", "bus", "zigzag"];

        window.addEventListener("keydown", (e) => {
            if (!gameStarted) {
                gameStarted = true;
                toggleMusic();
            }
            keys[e.key] = true;
            if (isGameOver && e.code === "Space" && explosionTimer <= 0) restartGame();
        });

        window.addEventListener("keyup", (e) => keys[e.key] = false);

        window.addEventListener("click", () => {
            if (!gameStarted) {
                gameStarted = true;
                toggleMusic();
            }
        });

        for (let i = 0; i < 8; i++) trees.push({ y: i * 100 });

        function getRoadType() {
            let cycle = Math.floor(score / 500) % 3;
            if (cycle === 0) return "night";
            if (cycle === 1) return "rain";
            return "ice";
        }

        function updateDynamicRoad() {
            roadEventTimer++;
            if (roadEventTimer > 350 && currentRoadEvent === "normal") {
                roadEventTimer = 0;
                let events = ["split", "construction", "narrow"];
                currentRoadEvent = events[Math.floor(Math.random() * events.length)];
                roadEventDuration = 300;

                if (currentRoadEvent === "construction") {
                    roadBlockages.push({ x: 210, y: -100, w: 110, h: 40 });
                }
            }

            if (currentRoadEvent !== "normal") {
                roadEventDuration--;
                if (roadEventDuration <= 0) {
                    currentRoadEvent = "normal";
                    roadBlockages = [];
                }
            }
        }

        function spawnObstacle() {
            if (!gameStarted || isGameOver) return;
            let lanes = [85, 210, 335, 460];
            if (currentRoadEvent === "narrow") {
                lanes = [210, 335];
            }

            let x = lanes[Math.floor(Math.random() * lanes.length)];
            let type = carTypes[Math.floor(Math.random() * carTypes.length)];

            let w = 50, h = 90;
            if (type === "suv") { w = 54; h = 95; }
            else if (type === "van") { w = 52; h = 100; }
            else if (type === "bus") { w = 56; h = 140; }
            else if (type === "zigzag") { w = 50; h = 90; }

            let isRiskyLane = (x === 85 || x === 460);
            let speedBoost = Math.min(2.0, 1 + Math.floor(score / 100) * 0.1);

            obstacles.push({
                x: x,
                y: -150,
                w: w,
                h: h,
                speed: (Math.random() * 1.0 + 2.5) * speedBoost,
                type: type,
                color: carColors[Math.floor(Math.random() * carColors.length)],
                zigzagDir: Math.random() > 0.5 ? 1.2 : -1.2,
                isRisky: isRiskyLane,
                scored: false
            });

            if (Math.random() < 0.2 && shields.length === 0) {
                let shieldX = lanes[Math.floor(Math.random() * lanes.length)];
                shields.push({ x: shieldX + 10, y: -100, w: 30, h: 30, speed: 2.8 * speedBoost });
            }
        }

        let obstacleTimer = setInterval(spawnObstacle, 1400);

        function update() {
            if (!gameStarted || isGameOver) {
                if (isGameOver && explosionTimer > 0) {
                    explosionTimer--;
                    car.scaleX = Math.max(0.2, car.scaleX - 0.03);
                    car.scaleY = Math.max(0.2, car.scaleY - 0.03);
                    car.angle += 0.1;
                }
                particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.alpha -= 0.02; });
                return;
            }

            updateDynamicRoad();
            if (screenShakeTimer > 0) screenShakeTimer--;

            let roadType = getRoadType();
            let timeMultiplier = isSlowMo ? 0.4 : 1;
            
            let speedBoost = Math.min(2.0, 1 + Math.floor(score / 100) * 0.1);
            let roadSpeed = 4 * speedBoost * timeMultiplier;

            roadY = (roadY + roadSpeed) % 40;
            trees.forEach(tree => {
                tree.y += roadSpeed;
                if (tree.y > canvas.height) tree.y = -100;
            });

            if (!isSlowMo && adrenaline > 0) {
                adrenaline = Math.max(0, adrenaline - 0.05);
            }

            if (adrenaline >= 100 && !isSlowMo) {
                isSlowMo = true;
                slowMoTimer = 180;
                adrenaline = 0; 
                addFloatingText("⚡ SLOW-MO ACTIVE!", canvas.width/2 - 110, 180, "#00ffcc");
            }

            if (isSlowMo) {
                slowMoTimer--;
                if (slowMoTimer <= 0) {
                    isSlowMo = false;
                }
            }

            let moveSpeed = (roadType === "ice" ? 3.0 : car.speed) * timeMultiplier;
            if (keys["ArrowLeft"] && car.x > 55) car.x -= moveSpeed;
            if (keys["ArrowRight"] && car.x < canvas.width - 55 - car.w) car.x += moveSpeed;

            for (let i = shields.length - 1; i >= 0; i--) {
                let s = shields[i];
                s.y += s.speed * timeMultiplier;
                if (
                    car.x < s.x + s.w && car.x + car.w > s.x &&
                    car.y < s.y + s.h && car.y + car.h > s.y
                ) {
                    hasShield = true;
                    shields.splice(i, 1);
                    addFloatingText("🛡️ KHIÊN BẢO VỆ!", car.x, car.y - 20, "#00ffcc");
                } else if (s.y > canvas.height) {
                    shields.splice(i, 1);
                }
            }

            for (let i = roadBlockages.length - 1; i >= 0; i--) {
                let rb = roadBlockages[i];
                rb.y += roadSpeed;
                if (
                    car.x < rb.x + rb.w && car.x + car.w > rb.x &&
                    car.y < rb.y + rb.h && car.y + car.h > rb.y
                ) {
                    handleCrash();
                }
                if (rb.y > canvas.height) roadBlockages.splice(i, 1);
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += obs.speed * timeMultiplier;

                if (obs.type === "zigzag") {
                    obs.x += obs.zigzagDir * timeMultiplier;
                    if (obs.x < 55 || obs.x > 545 - obs.w) obs.zigzagDir *= -1;
                }

                if (!obs.nearMissed && obs.y > car.y - 40 && obs.y < car.y + car.h) {
                    let distance = Math.abs((car.x + car.w/2) - (obs.x + obs.w/2));
                    if (distance > 50 && distance < 85) {
                        obs.nearMissed = true;
                        combo++;
                        adrenaline = Math.min(100, adrenaline + 25);

                        let multiplier = combo >= 5 ? 5 : (combo >= 3 ? 3 : 2);
                        let bonus = 50 * multiplier;
                        score += (obs.isRisky ? bonus * 2 : bonus);

                        addFloatingText(`⚡ NEAR MISS x${multiplier}`, car.x, car.y - 30, "#ffcc00");
                    }
                }

                if (
                    car.x < obs.x + obs.w - 5 &&
                    car.x + car.w - 5 > obs.x &&
                    car.y < obs.y + obs.h - 5 &&
                    car.y + car.h - 5 > obs.y
                ) {
                    handleCrash();
                }

                if (obs.y > canvas.height && !obs.scored) {
                    obs.scored = true;
                    score += (obs.isRisky ? 20 : 10);
                }

                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }

            floatingTexts.forEach(ft => { ft.y -= 1.5; ft.alpha -= 0.02; });
            floatingTexts = floatingTexts.filter(ft => ft.alpha > 0);
        }

        function handleCrash() {
            if (hasShield) {
                hasShield = false;
                addFloatingText("🛡️ KHIÊN ĐÃ ĐỠ ĐÒN!", car.x, car.y - 30, "#00e5ff");
                obstacles.shift();
            } else {
                combo = 0;
                screenShakeTimer = 20;
                triggerGameOver();
            }
        }

        function addFloatingText(text, x, y, color) {
            floatingTexts.push({ text: text, x: x, y: y, color: color, alpha: 1 });
        }

        function triggerGameOver() {
            isGameOver = true;
            explosionTimer = 60;
            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: car.x + car.w / 2, y: car.y + car.h / 2,
                    vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
                    size: Math.random() * 6 + 2, color: Math.random() > 0.5 ? "#ff3300" : "#ffcc00", alpha: 1
                });
            }
        }

        function drawStylized3DCar(x, y, w, h, color, type, scaleX = 1, scaleY = 1, angle = 0) {
            ctx.save();
            ctx.translate(x + w/2, y + h/2);
            ctx.rotate(angle);
            ctx.scale(scaleX, scaleY);
            ctx.translate(-(x + w/2), -(y + h/2));

            ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
            ctx.beginPath();
            ctx.ellipse(x + w/2, y + h + 4, w/2 + 4, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            let grad = ctx.createLinearGradient(x, y, x, y + h);
            grad.addColorStop(0, lightenColor(color, 30));
            grad.addColorStop(0.5, color);
            grad.addColorStop(1, darkenColor(color, 40));

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, type === "bus" ? 8 : 14);
            ctx.fill();

            ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.fillStyle = "#0f172a";
            ctx.beginPath();
            if (type === "bus") {
                for (let yy = y + 15; yy < y + h - 20; yy += 25) {
                    ctx.roundRect(x + 6, yy, w - 12, 16, 4);
                }
            } else if (type === "suv" || type === "van") {
                ctx.roundRect(x + 6, y + 16, w - 12, 28, 6);
                ctx.roundRect(x + 8, y + h - 32, w - 16, 18, 5);
            } else {
                ctx.roundRect(x + 7, y + 18, w - 14, 22, 6);
                ctx.roundRect(x + 8, y + h - 28, w - 16, 14, 4);
            }
            ctx.fill();

            ctx.fillStyle = "#090d16";
            ctx.strokeStyle = "#475569";
            ctx.lineWidth = 2;
            let wheels = [
                {wx: x - 6, wy: y + 12}, {wx: x + w - 2, wy: y + 12},
                {wx: x - 6, wy: y + h - 30}, {wx: x + w - 2, wy: y + h - 30}
            ];
            wheels.forEach(wL => {
                ctx.beginPath();
                ctx.roundRect(wL.wx, wL.wy, 8, 22, 3);
                ctx.fill();
                ctx.stroke();
            });

            ctx.fillStyle = "#facc15";
            ctx.shadowColor = "#facc15";
            ctx.shadowBlur = 10;
            ctx.fillRect(x + 4, y + 2, 8, 5);
            ctx.fillRect(x + w - 12, y + 2, 8, 5);
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        function lightenColor(col, percent) {
            let num = parseInt(col.replace("#",""), 16), amt = Math.round(2.55 * percent);
            let R = (num >> 16) + amt, G = (num >> 8 & 0x00FF) + amt, B = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
        }
        function darkenColor(col, percent) {
            let num = parseInt(col.replace("#",""), 16), amt = Math.round(2.55 * percent);
            let R = (num >> 16) - amt, G = (num >> 8 & 0x00FF) - amt, B = (num & 0x0000FF) - amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
        }

        function drawTree(x, y) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
            ctx.beginPath();
            ctx.ellipse(x + 15, y + 55, 14, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#8B5A2B";
            ctx.fillRect(x + 10, y + 30, 10, 25);
            
            ctx.fillStyle = "#16a34a";
            ctx.beginPath();
            ctx.arc(x + 15, y + 22, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#22c55e";
            ctx.beginPath();
            ctx.arc(x + 15, y + 18, 12, 0, Math.PI * 2);
            ctx.fill();
        }

        function draw() {
            ctx.save();
            if (screenShakeTimer > 0) {
                let shakeX = (Math.random() - 0.5) * 8;
                let shakeY = (Math.random() - 0.5) * 8;
                ctx.translate(shakeX, shakeY);
            }

            let roadType = getRoadType();

            if (roadType === "night") ctx.fillStyle = "#090d16";
            else if (roadType === "rain") ctx.fillStyle = "#1e293b";
            else ctx.fillStyle = "#e2e8f0";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (isSlowMo) {
                ctx.fillStyle = "rgba(0, 229, 255, 0.15)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.fillStyle = roadType === "ice" ? "#cbd5e1" : (roadType === "night" ? "#111827" : "#334155");
            ctx.fillRect(50, 0, 500, canvas.height);

            if (currentRoadEvent === "narrow") {
                ctx.fillStyle = "rgba(255, 51, 102, 0.2)";
                ctx.fillRect(50, 0, 150, canvas.height);
                ctx.fillRect(400, 0, 150, canvas.height);
            } else if (currentRoadEvent === "split") {
                ctx.fillStyle = "rgba(0, 229, 255, 0.15)";
                ctx.fillRect(210, 0, 180, canvas.height);
            }

            ctx.fillStyle = roadType === "ice" ? "#94a3b8" : "#fff";
            ctx.fillRect(50, 0, 5, canvas.height);
            ctx.fillRect(545, 0, 5, canvas.height);

            ctx.strokeStyle = roadType === "ice" ? "#64748b" : "#fff";
            ctx.lineWidth = 4;
            ctx.setLineDash([25, 15]);
            let speedBoost = Math.min(2.0, 1 + Math.floor(score / 100) * 0.1);
            let roadSpeed = 4 * speedBoost;
            ctx.lineDashOffset = -roadY;
            ctx.beginPath();
            ctx.moveTo(175, 0); ctx.lineTo(175, canvas.height);
            ctx.moveTo(300, 0); ctx.lineTo(300, canvas.height);
            ctx.moveTo(425, 0); ctx.lineTo(425, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            trees.forEach(tree => { drawTree(5, tree.y); drawTree(canvas.width - 35, tree.y); });

            roadBlockages.forEach(rb => {
                ctx.fillStyle = "#f59e0b";
                ctx.fillRect(rb.x, rb.y, rb.w, rb.h);
                ctx.fillStyle = "#000";
                ctx.font = "bold 13px Arial";
                ctx.fillText("🚧 CÔNG TRƯỜNG", rb.x + 3, rb.y + 25);
            });

            drawStylized3DCar(car.x, car.y, car.w, car.h, "#00e5ff", "supercar", car.scaleX, car.scaleY, car.angle);
            if (hasShield) {
                ctx.strokeStyle = "#00ffcc";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(car.x + car.w/2, car.y + car.h/2, 45, 0, Math.PI * 2);
                ctx.stroke();
            }

            shields.forEach(s => {
                ctx.fillStyle = "#00ffcc";
                ctx.beginPath();
                ctx.arc(s.x + s.w/2, s.y + s.h/2, 16, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#000";
                ctx.font = "bold 14px Arial";
                ctx.fillText("🛡️", s.x + 3, s.y + 21);
            });

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
            });

            obstacles.forEach(obs => { drawStylized3DCar(obs.x, obs.y, obs.w, obs.h, obs.color, obs.type); });

            floatingTexts.forEach(ft => {
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = ft.alpha;
                ctx.font = "bold 16px Arial";
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.globalAlpha = 1;
            });

            // HUD
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(15, 15, 220, 100);
            ctx.strokeStyle = "#00e5ff";
            ctx.strokeRect(15, 15, 220, 100);

            ctx.fillStyle = "#fff";
            ctx.font = "bold 18px Arial";
            ctx.fillText("Điểm: " + score, 25, 42);
            ctx.fillStyle = "#38bdf8";
            ctx.font = "13px Arial";
            ctx.fillText("Combo: x" + combo, 25, 66);

            ctx.fillStyle = "#555";
            ctx.fillRect(25, 76, 140, 12);
            ctx.fillStyle = isSlowMo ? "#00ffcc" : "#ff3366";
            let adFill = isSlowMo ? (slowMoTimer / 180) * 140 : (adrenaline / 100) * 140;
            ctx.fillRect(25, 76, adFill, 12);
            ctx.strokeStyle = "#fff";
            ctx.strokeRect(25, 76, 140, 12);

            ctx.fillStyle = "#fff";
            ctx.font = "9px Arial";
            ctx.fillText(isSlowMo ? "⚡ SLOW-MO ACTIVE" : "ADRENALINE", 30, 95);

            if (currentRoadEvent !== "normal") {
                ctx.fillStyle = "rgba(255, 51, 102, 0.85)";
                ctx.fillRect(canvas.width / 2 - 120, 15, 240, 32);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 13px Arial";
                ctx.textAlign = "center";
                ctx.fillText(`⚠️ SỰ KIỆN: ${currentRoadEvent.toUpperCase()} ⚠️`, canvas.width / 2, 35);
                ctx.textAlign = "left";
            }

            if (!gameStarted) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#00e5ff";
                ctx.font = "bold 28px Arial";
                ctx.textAlign = "center";
                ctx.fillText("🏎️ ĐUA XE SIÊU TỐC", canvas.width / 2, 240);

                ctx.fillStyle = "#fff";
                ctx.font = "16px Arial";
                ctx.fillText("Bấm phím bất kỳ hoặc Click để bắt đầu", canvas.width / 2, 300);
                ctx.textAlign = "left";
            }

            if (isGameOver && explosionTimer <= 0) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ff3366";
                ctx.font = "bold 36px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, 240);

                ctx.fillStyle = "#fff";
                ctx.font = "22px Arial";
                ctx.fillText("Tổng điểm: " + score, canvas.width / 2, 290);
                
                ctx.fillStyle = "#00e5ff";
                ctx.font = "16px Arial";
                ctx.fillText("Nhấn SPACE để chơi lại", canvas.width / 2, 340);
                ctx.textAlign = "left";
            }

            ctx.restore();
        }

        function restartGame() {
            car.x = 275; car.y = 520;
            car.scaleX = 1; car.scaleY = 1; car.angle = 0;
            obstacles = []; shields = []; roadBlockages = []; particles = []; floatingTexts = [];
            score = 0; combo = 0; adrenaline = 0; hasShield = false;
            isSlowMo = false; slowMoTimer = 0; screenShakeTimer = 0;
            currentRoadEvent = "normal";
            isGameOver = false; explosionTimer = 0;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
