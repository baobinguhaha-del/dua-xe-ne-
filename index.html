<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đua Xe Né Chướng Ngại Vật Nâng Cao</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }
        canvas {
            border: 4px solid #00e5ff;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
            background: #222;
        }
    </style>
</head>
<body>
    <h2>🏎️ ĐUA XE NÉ CHƯỚNG NGOẠI VẬT (NÂNG CAO) 🌲</h2>
    <p>Dùng phím mũi tên <b>Trái / Phải</b> để né xe và đá! Xe cản có thể di chuyển nhanh chậm ngẫu nhiên.</p>
    <canvas id="gameCanvas" width="450" height="650"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Xe người chơi
        let car = { x: 195, y: 520, w: 50, h: 90, speed: 7 };
        let obstacles = [];
        let trees = [];
        let score = 0;
        let isGameOver = false;
        let keys = {};
        let roadY = 0;

        const carColors = ["#ff3366", "#ff9900", "#33cc33", "#9933ff", "#ffff00", "#00bcd4"];

        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if (isGameOver && e.code === "Space") restartGame();
        });
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        // Khởi tạo hàng cây bên đường
        for (let i = 0; i < 8; i++) {
            trees.push({ y: i * 100 });
        }

        function spawnObstacle() {
            if (isGameOver) return;
            let lanes = [65, 195, 325];
            let x = lanes[Math.floor(Math.random() * lanes.length)];
            let isRock = Math.random() < 0.3; // 30% là đá, 70% là xe

            obstacles.push({
                x: x,
                y: -120,
                w: 50,
                h: isRock ? 50 : 90,
                speed: Math.random() * 3 + 3, // Tốc độ ngẫu nhiên từ 3 đến 6
                type: isRock ? "rock" : "car",
                color: carColors[Math.floor(Math.random() * carColors.length)]
            });
        }

        setInterval(spawnObstacle, 1600);

        function update() {
            if (isGameOver) return;

            roadY = (roadY + 6) % 40;

            // Di chuyển cây hai bên đường theo tốc độ mặt đường
            trees.forEach(tree => {
                tree.y += 6;
                if (tree.y > canvas.height) tree.y = -100;
            });

            // Điều khiển xe người chơi
            if (keys["ArrowLeft"] && car.x > 35) car.x -= car.speed;
            if (keys["ArrowRight"] && car.x < canvas.width - 85) car.x += car.speed;

            // Cập nhật chướng ngại vật
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                // Xe chướng ngại vật di chuyển với tốc độ riêng của nó (có thể chạy nhanh hoặc chậm)
                obs.y += obs.speed;

                // Kiểm tra va chạm
                if (
                    car.x < obs.x + obs.w - 5 &&
                    car.x + car.w - 5 > obs.x &&
                    car.y < obs.y + obs.h - 5 &&
                    car.y + car.h - 5 > obs.y
                ) {
                    isGameOver = true;
                }

                // Xóa vật cản khi đi qua màn hình và cộng điểm
                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                }
            }
        }

        function drawCar(x, y, w, h, color) {
            // Thân xe
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 10);
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Kính chắn gió
            ctx.fillStyle = "#111";
            ctx.fillRect(x + 8, y + 15, w - 16, 18);

            // Bánh xe
            ctx.fillStyle = "#000";
            ctx.fillRect(x - 4, y + 10, 5, 18);
            ctx.fillRect(x + w, y + 10, 5, 18);
            ctx.fillRect(x - 4, y + h - 28, 5, 18);
            ctx.fillRect(x + w, y + h - 28, 5, 18);

            // Đèn xe
            ctx.fillStyle = "#fff700";
            ctx.fillRect(x + 5, y + 2, 8, 4);
            ctx.fillRect(x + w - 13, y + 2, 8, 4);
        }

        function drawRock(x, y, w, h) {
            ctx.fillStyle = "#888";
            ctx.beginPath();
            ctx.moveTo(x + 10, y);
            ctx.lineTo(x + w, y + 15);
            ctx.lineTo(x + w - 5, y + h);
            ctx.lineTo(x + 5, y + h - 5);
            ctx.lineTo(x, y + 20);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function drawTree(x, y) {
            // Thân cây
            ctx.fillStyle = "#8B5A2B";
            ctx.fillRect(x + 10, y + 30, 10, 25);
            // Tán lá
            ctx.fillStyle = "#228B22";
            ctx.beginPath();
            ctx.arc(x + 15, y + 25, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#145A14";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function draw() {
            // Nền cỏ hai bên đường
            ctx.fillStyle = "#2d6a4f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Lòng đường chính màu xám tối
            ctx.fillStyle = "#333";
            ctx.fillRect(35, 0, canvas.width - 70, canvas.height);

            // Vạch lề đường trắng đỏ
            ctx.fillStyle = "#fff";
            ctx.fillRect(35, 0, 5, canvas.height);
            ctx.fillRect(canvas.width - 40, 0, 5, canvas.height);

            // Vạch phân làn đứt đoạn
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 4;
            ctx.setLineDash([25, 15]);
            ctx.lineDashOffset = -roadY;
            ctx.beginPath();
            ctx.moveTo(170, 0); ctx.lineTo(170, canvas.height);
            ctx.moveTo(280, 0); ctx.lineTo(280, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Vẽ hàng cây hai bên vỉa hè
            trees.forEach(tree => {
                drawTree(5, tree.y);                     // Hàng cây bên trái
                drawTree(canvas.width - 35, tree.y);     // Hàng cây bên phải
            });

            // Vẽ xe của người chơi
            drawCar(car.x, car.y, car.w, car.h, "#00e5ff");

            // Vẽ các chướng ngại vật (xe hoặc đá)
            obstacles.forEach(obs => {
                if (obs.type === "car") {
                    drawCar(obs.x, obs.y, obs.w, obs.h, obs.color);
                } else {
                    drawRock(obs.x, obs.y, obs.w, obs.h);
                }
            });

            // Hiển thị điểm số
            ctx.fillStyle = "#fff";
            ctx.font = "bold 20px Arial";
            ctx.fillText("Điểm: " + score, 45, 35);

            // Màn hình khi thua cuộc
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ff3366";
                ctx.font = "bold 32px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, 260);

                ctx.fillStyle = "#fff";
                ctx.font = "20px Arial";
                ctx.fillText("Tổng điểm: " + score, canvas.width / 2, 300);
                
                ctx.fillStyle = "#00e5ff";
                ctx.font = "16px Arial";
                ctx.fillText("Nhấn SPACE để chơi lại", canvas.width / 2, 350);
                ctx.textAlign = "left";
            }
        }

        function restartGame() {
            car.x = 195;
            obstacles = [];
            score = 0;
            isGameOver = false;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
