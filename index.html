<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Đua Xe Né Chướng Ngại Vật</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }
        canvas {
            background: #333;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div>
        <h2>Đua Xe Né Chướng Ngại Vật</h2>
        <p>Sử dụng phím mũi tên <b>Trái</b> và <b>Phải</b> để điều khiển xe.</p>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let car = { x: 175, y: 500, width: 50, height: 80, speed: 5 };
        let obstacles = [];
        let score = 0;
        let isGameOver = false;
        let keys = {};

        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        function spawnObstacle() {
            let lanes = [50, 150, 250];
            let x = lanes[Math.floor(Math.random() * lanes.length)];
            obstacles.push({ x: x, y: -100, width: 50, height: 80, speed: 4 });
        }

        setInterval(spawnObstacle, 2000);

        function update() {
            if (isGameOver) return;

            // Di chuyển xe người chơi
            if (keys["ArrowLeft"] && car.x > 30) car.x -= car.speed;
            if (keys["ArrowRight"] && car.x < canvas.width - 80) car.x += car.speed;

            // Cập nhật chướng ngại vật
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed;

                // Kiểm tra va chạm
                if (
                    car.x < obstacles[i].x + obstacles[i].width &&
                    car.x + car.width > obstacles[i].x &&
                    car.y < obstacles[i].y + obstacles[i].height &&
                    car.y + car.height > obstacles[i].y
                ) {
                    isGameOver = true;
                }

                // Xóa vật cản khi ra ngoài màn hình và tăng điểm
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                }
            }
        }

        function draw() {
            // Xóa màn hình
            ctx.fillStyle = "#444";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ làn đường
            ctx.strokeStyle = "#fff";
            ctx.setLineDash([20, 20]);
            ctx.beginPath();
            ctx.moveTo(133, 0); ctx.lineTo(133, canvas.height);
            ctx.moveTo(266, 0); ctx.lineTo(266, canvas.height);
            ctx.stroke();

            // Vẽ xe người chơi
            ctx.fillStyle = "#ff2e2e";
            ctx.fillRect(car.x, car.y, car.width, car.height);

            // Vẽ chướng ngại vật
            ctx.fillStyle = "#2ecc71";
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });

            // Hiển thị điểm số
            ctx.fillStyle = "#fff";
            ctx.font = "20px Arial";
            ctx.fillText("Điểm: " + score, 20, 30);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.font = "30px Arial";
                ctx.fillText("GAME OVER", 110, 280);
                ctx.font = "16px Arial";
                ctx.fillText("Nhấn F5 để chơi lại", 130, 320);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
