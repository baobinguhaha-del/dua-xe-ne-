<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đua Xe Né Siêu Xe Toàn Cầu</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }
        canvas {
            border: 4px solid #00e5ff;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
            background: #222;
        }
    </style>
</head>
<body>
    <h2>🏎️ ĐUA XE SIÊU TỐC - CHỈ NÉ XE Ô TÔ 🚗</h2>
    <p>Dùng phím <b>Trái / Phải</b> để né các loại xe trên đường. Tốc độ tăng dần mỗi 100 điểm!</p>
    <canvas id="gameCanvas" width="450" height="650"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Lòng đường: Từ x = 40 đến x = 410 (chiều rộng 370px)
        let car = { x: 200, y: 520, w: 50, h: 90, speed: 7, scaleX: 1, scaleY: 1, angle: 0 };
        let obstacles = [];
        let trees = [];
        let particles = [];
        let score = 0;
        let isGameOver = false;
        let explosionTimer = 0;
        let keys = {};
        let roadY = 0;

        const carColors = ["#ff3366", "#ff9900", "#33cc33", "#9933ff", "#ffff00", "#00bcd4", "#ff4757", "#2ed573"];
        const carTypes = ["supercar", "suv", "sedan", "van"];

        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if (isGameOver && e.code === "Space" && explosionTimer <= 0) restartGame();
        });
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        for (let i = 0; i < 8; i++) {
            trees.push({ y: i * 100 });
        }

        function spawnObstacle() {
            if (isGameOver) return;
            // 3 làn đường chính nằm gọn trong lòng đường
            let lanes = [55, 200, 345];
            let x = lanes[Math.floor(Math.random() * lanes.length)];
            let type = carTypes[Math.floor(Math.random() * carTypes.length)];

            let w = 50, h = 90;
            if (type === "suv") { w = 54; h = 95; }
            else if (type === "van") { w = 52; h = 100; }
            else if (type === "supercar") { w = 50; h = 85; }

            let speedMultiplier = 1 + Math.floor(score / 100) * 0.4;

            obstacles.push({
                x: x,
                y: -130,
                w: w,
                h: h,
                speed: (Math.random() * 2.5 + 3.5) * speedMultiplier,
                type: type,
                color: carColors[Math.floor(Math.random() * carColors.length)]
            });
        }

        let spawnInterval = 1200; 
        let obstacleTimer = setInterval(spawnObstacle, spawnInterval);

        function update() {
            if (isGameOver) {
                if (explosionTimer > 0) {
                    explosionTimer--;
                    car.scaleX = Math.max(0.2, car.scaleX - 0.03);
                    car.scaleY = Math.max(0.2, car.scaleY - 0.03);
                    car.angle += 0.1;
                }
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.02;
                });
                return;
            }

            let currentSpeedBoost = 1 + Math.floor(score / 100) * 0.4;
            let roadSpeed = 6 * currentSpeedBoost;

            roadY = (roadY + roadSpeed) % 40;

            trees.forEach(tree => {
                tree.y += roadSpeed;
                if (tree.y > canvas.height) tree.y = -100;
            });

            // Giới hạn xe người chơi không chạy ra ngoài lề đường
            if (keys["ArrowLeft"] && car.x > 45) car.x -= car.speed;
            if (keys["ArrowRight"] && car.x < canvas.width - 45 - car.w) car.x += car.speed;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += obs.speed;

                // Kiểm tra va chạm với xe chướng ngại vật
                if (
                    car.x < obs.x + obs.w - 5 &&
                    car.x + car.w - 5 > obs.x &&
                    car.y < obs.y + obs.h - 5 &&
                    car.y + car.h - 5 > obs.y
                ) {
                    triggerGameOver();
                }

                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                }
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            explosionTimer = 60;

            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: car.x + car.w / 2,
                    y: car.y + car.h / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    size: Math.random() * 6 + 2,
                    color: Math.random() > 0.5 ? "#ff3300" : "#ffcc00",
                    alpha: 1
                });
            }
        }

        function drawCar(x, y, w, h, color, type, scaleX = 1, scaleY = 1, angle = 0) {
            ctx.save();
            ctx.translate(x + w/2, y + h/2);
            ctx.rotate(angle);
            ctx.scale(scaleX, scaleY);
            ctx.translate(-(x + w/2), -(y + h/2));

            // Thân xe
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, type === "van" ? 6 : 12);
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.stroke();

            if (type === "supercar") {
                ctx.fillStyle = "#111";
                ctx.fillRect(x + 6, y + 22, w - 12, 14);
                ctx.fillRect(x + 8, y + h - 22, w - 16, 10);
                ctx.fillStyle = "#000";
                ctx.fillRect(x - 2, y + h - 8, w + 4, 5);
            } else if (type === "suv") {
                ctx.fillStyle = "#111";
                ctx.fillRect(x + 6, y + 18, w - 12, 26);
                ctx.fillRect(x + 8, y + h - 30, w - 16, 18);
            } else if (type === "van") {
                ctx.fillStyle = "#111";
                ctx.fillRect(x + 5, y + 12, w - 10, 32);
                ctx.fillRect(x + 6, y + h - 38, w - 12, 22);
            } else {
                ctx.fillStyle = "#111";
                ctx.fillRect(x + 7, y + 18, w - 14, 20);
                ctx.fillRect(x + 8, y + h - 28, w - 16, 14);
            }

            // Bánh xe
            ctx.fillStyle = "#111";
            ctx.fillRect(x - 5, y + 12, 6, 20);
            ctx.fillRect(x + w - 1, y + 12, 6, 20);
            ctx.fillRect(x - 5, y + h - 30, 6, 20);
            ctx.fillRect(x + w - 1, y + h - 30, 6, 20);

            // Đèn pha
            ctx.fillStyle = "#fff700";
            ctx.fillRect(x + 4, y + 2, 8, 4);
            ctx.fillRect(x + w - 12, y + 2, 8, 4);

            ctx.restore();
        }

        function drawTree(x, y) {
            ctx.fillStyle = "#8B5A2B";
            ctx.fillRect(x + 10, y + 30, 10, 25);
            ctx.fillStyle = "#228B22";
            ctx.beginPath();
            ctx.arc(x + 15, y + 25, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#145A14";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function draw() {
            ctx.fillStyle = "#2d6a4f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Lòng đường
            ctx.fillStyle = "#333";
            ctx.fillRect(40, 0, 370, canvas.height);

            // Vạch lề đường
            ctx.fillStyle = "#fff";
            ctx.fillRect(40, 0, 5, canvas.height);
            ctx.fillRect(405, 0, 5, canvas.height);

            // Vạch đứt đoạn phân làn
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 4;
            ctx.setLineDash([25, 15]);
            let currentSpeedBoost = 1 + Math.floor(score / 100) * 0.4;
            ctx.lineDashOffset = -roadY;
            ctx.beginPath();
            ctx.moveTo(163, 0); ctx.lineTo(163, canvas.height);
            ctx.moveTo(286, 0); ctx.lineTo(286, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            trees.forEach(tree => {
                drawTree(5, tree.y);
                drawTree(canvas.width - 35, tree.y);
            });

            // Vẽ xe của người chơi
            drawCar(car.x, car.y, car.w, car.h, "#00e5ff", "supercar", car.scaleX, car.scaleY, car.angle);

            // Hiệu ứng nổ
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            // Vẽ danh sách xe chướng ngại vật
            obstacles.forEach(obs => {
                drawCar(obs.x, obs.y, obs.w, obs.h, obs.color, obs.type);
            });

            // Giao diện điểm số
            ctx.fillStyle = "#fff";
            ctx.font = "bold 20px Arial";
            ctx.fillText("Điểm: " + score, 50, 35);
            ctx.font = "14px Arial";
            ctx.fillStyle = "#ffcc00";
            ctx.fillText("Tốc độ: x" + currentSpeedBoost.toFixed(1), 50, 60);

            if (isGameOver && explosionTimer <= 0) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ff3366";
                ctx.font = "bold 32px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, 240);

                ctx.fillStyle = "#fff";
                ctx.font = "20px Arial";
                ctx.fillText("Tổng điểm: " + score, canvas.width / 2, 290);
                
                ctx.fillStyle = "#00e5ff";
                ctx.font = "16px Arial";
                ctx.fillText("Nhấn SPACE để chơi lại", canvas.width / 2, 340);
                ctx.textAlign = "left";
            }
        }

        function restartGame() {
            car.x = 200;
            car.y = 520;
            car.scaleX = 1;
            car.scaleY = 1;
            car.angle =
